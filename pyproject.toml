[project]
name = "proxidize-integration-examples"
version = "1.0.0"
description = "Runnable Proxidize proxy examples for Python clients and automation tools"
readme = "README.md"
requires-python = ">=3.11.5"
dependencies = [
  "aiohttp==3.14.5",
  "aioquic==1.9.1",
  "certifi==2026.11.20",
  "httpx==0.28.1",
  "playwright==1.65.2",
  "pycurl==7.49.0",
  "requests==2.34.2",
  "scrapy==2.20.0",
  "selenium==4.54.0",
]

[project.optional-dependencies]
crawlers = [
  "crawl4ai==0.9.5",
  "scrapy-playwright==0.0.48",
]

[tool.uv]
package = false
